name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run check-secrets
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  e2e:
    # Real Postgres + pgvector; the test brings its own fake embedder, so no Ollama is needed.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway CI container, reachable only from this job
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/e2e.test.js
        env:
          QUIETMEM_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
