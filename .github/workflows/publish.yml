name: publish
# Publishes to npm when a GitHub release is published.
# Auth: npm trusted publishing (OIDC). The package is linked to this repo and workflow on npmjs.com
# (package settings, "Trusted Publisher"), so no token is stored in GitHub. --provenance ties each
# version to the workflow run that built it. A version already on npm is skipped, not an error.
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.17.0   # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run check-secrets
      - name: Skip if this version is already published
        id: exists
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "quietmem@$V" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "quietmem@$V is already on npm"; fi
      - if: steps.exists.outputs.skip != 'true'
        run: npm publish --provenance --access public
